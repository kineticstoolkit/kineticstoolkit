[tool.ruff]
line-length = 79
target-version = "py313"
exclude = [
	"DataDescriptions.py",
	"MoCapData.py",
	"NatNetClient.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "PL", "D", "NPY", "PD"]
ignore = ["D203", "D212", "D105", "D107"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
exclude = [
]

[tool.pytest.ini_options]
filterwarnings = [
    # TO REMOVE IN 2027
    # TimeSeries
    'ignore:The function sort_events is deprecated since 0.15 and is scheduled to be removed in 2027',
]

[tool.coverage.run]
omit = [
	"tests/*",
]
