[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
	"icp.py",
]

[tool.ruff.lint]
select = ["B", "E", "W", "F", "I", "UP", "PL", "D", "NPY", "PD"]
ignore = ["D203", "D212", "D105", "D107", "PLR0913", "B028", "B904", "PLW1641"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-returns = 10
max-branches = 15
allow-magic-value-types = ["int", "str", "bytes"]

[tool.mypy]
exclude = [
]

[tool.pytest.ini_options]
filterwarnings = [
    # TO REMOVE IN 2027
    # TimeSeries
    'ignore:The function sort_events is deprecated since 0.15 and is scheduled to be removed in 2027',
]

[tool.coverage.run]
omit = [
	"tests/*",
]
